name: OpenCode GitHub Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # 只有當你在 Issues 留言 /opencode 或 /oc 時，AI 才會在雲端啟動
    if: contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenCode Agent
        uses: opencode-ai/agent-action@v2
        with:
          # 💡 這裡已經幫你設定成目前最強且免費的 DeepSeek 程式碼模型
          model: 'opencode/deepseek-v4-flash-free'
        env:
          # 這是 GitHub 內建的權限，完全不用手動設定金鑰
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
